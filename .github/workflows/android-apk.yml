name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: 同时构建 Release APK（CI 临时签名）
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  apk:
    name: Build APK (x86_64 runner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            "$SDKMANAGER" "platforms;android-35"
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            "$SDKMANAGER" "build-tools;35.0.0"
          fi
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Create CI keystore
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/travelog-ci.keystore" \
            -alias travelog \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass travelog -keypass travelog \
            -dname "CN=Travelog CI, OU=Build, O=Travelog, L=Tokyo, C=JP"

      - name: Build Release APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/travelog-ci.keystore" \
            -Pandroid.injected.signing.store.password=travelog \
            -Pandroid.injected.signing.key.alias=travelog \
            -Pandroid.injected.signing.key.password=travelog

      - name: Inspect APK (package / sdk / abi)
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|native-code" || true
          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: travelog-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: travelog-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Rename APK with version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/travelog-${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/travelog-${VERSION}-release.apk"
          ls -lh release-assets

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}"
          head -40 release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 旅记 ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-assets/*.apk
          draft: false
          prerelease: false