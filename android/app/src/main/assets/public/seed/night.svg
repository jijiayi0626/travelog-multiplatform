<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04131a" />
      <stop offset="0.6" stop-color="#0a2b30" />
      <stop offset="1" stop-color="#123b3a" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3a3d" />
      <stop offset="1" stop-color="#061418" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.14" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)" />

  <g fill="#e8f3ef" opacity="0.7">
