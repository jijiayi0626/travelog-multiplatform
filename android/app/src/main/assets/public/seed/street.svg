<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2416" />
      <stop offset="0.55" stop-color="#6d3f1b" />
      <stop offset="1" stop-color="#20130b" />
    </linearGradient>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#ffd79b" stop-opacity="0.95" />
      <stop offset="0.45" stop-color="#f0a85b" stop-opacity="0.35" />
      <stop offset="1" stop-color="#f0a85b" stop-opacity="0" />
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <path d="M0 120 L1200 60 L1200 0 L0 0 Z" fill="#1b0f08" opacity="0.9" />

  <g fill="#170d07">
    <rect x="0" y="150" width="330" height="470" />
    <rect x="900" y="120" width="300" height="500" />
    <rect x="360" y="210" width="220" height="410" />
    <rect x="690" y="180" width="180" height="440" />
  </g>

  <g fill="#f6b975" opacity="0.9">
    <rect x="52" y="220" width="34" height="46" />
    <rect x="128" y="220" width="34" height="46" />
    <rect x="936" y="210" width="36" height="48" />
    <rect x="1014" y="210" width="36" height="48" />
    <rect x="400" y="270" width="30" height="42" />
    <rect x="716" y="250" width="30" height="42" />
  </g>

  <g>
    <circle cx="590" cy="300" r="120" fill="url(#lamp)" />
    <ellipse cx="590" cy="300" rx="46" ry="58" fill="#f0714b" opacity="0.92" />
    <ellipse cx="590" cy="300" rx="46" ry="58" fill="none" stroke="#2a1108" stroke-width="6" />
    <rect x="586" y="228" width="8" height="26" fill="#241108" />
  </g>

  <g fill="#120a05">
    <rect x="470" y="420" width="240" height="220" rx="6" />
    <rect x="500" y="450" width="180" height="120" rx="4" fill="#f5b473" opacity="0.75" />
  </g>

  <g stroke="#f7c68d" stroke-width="2" opacity="0.28">
    <line x1="120" y1="640" x2="1080" y2="640" />
    <line x1="200" y1="676" x2="1000" y2="676" />
    <line x1="300" y1="712" x2="900" y2="712" />
  </g>

  <path d="M0 660 L1200 640 L1200 800 L0 800 Z" fill="#0d0704" />
  <rect width="1200" height="800" filter="url(#grain)" style="mix-blend-mode: overlay" opacity="0.6" />
</svg>