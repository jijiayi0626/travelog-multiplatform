<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#082e2a" />
      <stop offset="0.52" stop-color="#1c6659" />
      <stop offset="0.72" stop-color="#b98d5d" />
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#124a45" />
      <stop offset="1" stop-color="#051312" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f6cd92" stop-opacity="0.95" />
      <stop offset="1" stop-color="#f6cd92" stop-opacity="0" />
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.16" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)" />
