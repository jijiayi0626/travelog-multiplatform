name = "travelog"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 前端构建产物由同一个 Worker 托管，前后端不再分开部署。
# 部署前先在仓库根执行：npm run build
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "travelog"
database_id = "21cce9d3-6418-46d0-90ce-31f8ec5ad827"

[ai]
binding = "AI"

[vars]
CORS_ORIGIN = "*"
SITE_NAME = "旅记 Travelog"
# 管理员账号已写入 D1 settings（admin.username / admin.password），
# 不再在此处保存明文口令；如需初始化新库，临时设置 ADMIN_USER/ADMIN_TOKEN，
# 登录管理面板后立即修改口令并删除这两个变量。

# AI 配置不写在这里：登录管理面板 →「AI 接口」填写，保存在 D1 的 settings 表。

# 照片文件存 R2，D1 只存索引与访问密钥
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "travelog-photos"
