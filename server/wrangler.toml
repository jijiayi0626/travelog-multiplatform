name = "travelog"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 前端构建产物由同一个 Worker 托管，前后端不再分开部署。
# 部署前先在仓库根执行：npm run build
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "travelog"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

[ai]
binding = "AI"

[vars]
CORS_ORIGIN = "*"
SITE_NAME = "旅记 Travelog"
# 管理面板首次登录的引导口令：登录后立即在面板里改掉，然后删除此变量并重新部署
ADMIN_USER = "admin"
ADMIN_TOKEN = "change-me-now"

# AI 配置不写在这里：登录管理面板 →「AI 接口」填写，保存在 D1 的 settings 表。